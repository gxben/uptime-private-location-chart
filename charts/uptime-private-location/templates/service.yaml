{{- if .Values.service.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "uptime-private-location.fullname" . }}
  labels:
    {{- include "uptime-private-location.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
      protocol: TCP
      name: nagios
  selector:
    {{- include "uptime-private-location.selectorLabels" . | nindent 4 }}
{{- end }}
