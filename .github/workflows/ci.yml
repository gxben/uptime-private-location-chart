name: Continuous Integration

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Helm
        uses: azure/setup-helm@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Install chart-testing
        uses: helm/chart-testing-action@v2.7.0

      - name: Run ct lint
        run: ct lint --config ct.yaml --all

  template:
    name: Template & validate
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v7

      - name: Install Helm
        uses: azure/setup-helm@v5

      - name: Render default values
        run: helm template uptime-private-location charts/uptime-private-location > rendered-default.yaml

      - name: Render StatefulSet + persistence + service
        run: |
          helm template uptime-private-location charts/uptime-private-location \
            --set kind=StatefulSet \
            --set persistence.enabled=true \
            --set service.enabled=true \
            --set apiToken.secretName=my-secret \
            > rendered-statefulset.yaml

      - name: Install kubeconform
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz \
            | tar -xz -C /usr/local/bin kubeconform

      - name: Validate rendered manifests
        run: kubeconform -strict -summary rendered-default.yaml rendered-statefulset.yaml
